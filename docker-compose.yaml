services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - php

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: uldoska
      POSTGRES_USER: uldoska
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    ports:
        - "5432:5432"

  redis:
    image: redis:alpine
    restart: unless-stopped

volumes:
  postgres_data:
