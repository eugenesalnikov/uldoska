expose_php=Off
display_errors=Off
log_errors=On
upload_max_filesize=5M
post_max_size=45M
max_file_uploads=8
max_execution_time=60
max_input_time=60
default_socket_timeout=10
memory_limit=256M
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16
